<title>Claude Kamp</title>

<style>
/* Ring: tamna arena, crveni ugao, zlato za rang. Pet ekrana preko donje trake: Trening, Plan, Sveska, Rečnik, Profil. */
:root{
  --bg:#0E0F12; --surface:#17191F; --surface2:#20232B; --ink:#F1F2F5; --muted:#8E94A3; --line:#2A2E38;
  --red:#D7263D; --red-soft:#3A161C; --gold:#E8B23A; --gold-soft:#3A2E12; --green:#3DBE7E; --green-soft:#13301F; --blue:#5B8CFF; --blue-soft:#18213A;
  --display:"Archivo",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
html{scroll-padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-stretch:100%;font-size:15px;line-height:1.5;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background-image:radial-gradient(ellipse 120% 50% at 50% -10%,#2a1218 0%,transparent 60%);background-attachment:fixed}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;font-stretch:125%;text-wrap:balance}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;color:inherit;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:150px;resize:vertical}
.muted{color:var(--muted)}

.top{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;letter-spacing:.02em;text-transform:uppercase;font-stretch:125%}
.logo b{color:var(--red)}
.logo img{border-radius:9px;display:block}
.viewtitle{font-size:24px;font-weight:900;text-transform:uppercase}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.fighter{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.belt{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--belt) calc(var(--p)*1%),var(--line) 0)}
.belt::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface)}
.belt span{position:relative;font-size:30px}
.rank{font-size:22px;font-weight:900;text-transform:uppercase}
.xpline{color:var(--muted);font-size:13px}
.xpline b{color:var(--ink);font-family:var(--mono)}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:10px;padding:10px;text-align:center}
.stat .v{font-family:var(--mono);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stat.fire .v{color:var(--gold)}
.today{grid-column:1/-1;font-size:13px;padding:8px 12px;border-radius:8px;background:var(--red-soft);color:#ffb3bd}
.today.ok{background:var(--green-soft);color:#9be7bf}

.next{border-radius:16px;padding:18px;background:linear-gradient(135deg,#B81D33,#7A1222);display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.next::after{content:"🥊";position:absolute;right:-8px;bottom:-14px;font-size:96px;opacity:.15;transform:rotate(-15deg);pointer-events:none}
.next .eyebrow{color:#ffd0d6}
.next h2{font-size:24px;font-weight:900;line-height:1.1}
.next p{margin:0;color:#ffe3e7;max-width:56ch}
.next .task{background:rgba(0,0,0,.22);border-radius:10px;padding:10px 12px;font-size:14px}
.next .task b{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-right:6px;color:#ffd0d6}
.steps{margin:0;padding-left:20px;font-size:13px;color:#ffe3e7;display:flex;flex-direction:column;gap:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:12px 16px;font-weight:700;border-radius:10px}
.btn-w{background:#fff;color:#7A1222}
.btn-o{background:rgba(255,255,255,.12);color:#fff}
.btn-r{background:var(--red);color:#fff}
.btn-g{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}

.review{border-left:4px solid var(--blue);display:flex;flex-direction:column;gap:8px}
.review .eyebrow{color:var(--blue)}
.review h3{font-size:17px;font-weight:800;font-stretch:110%}

.secthead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.secthead h3{font-size:16px;font-weight:900;text-transform:uppercase}
.rounds{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rounds i{height:8px;border-radius:4px;background:var(--line)}
.rounds i.p{background:var(--red)} .rounds i.f{background:var(--green)}

.module{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.module.full{border-color:#245a3c}
.mhead{width:100%;display:flex;gap:12px;align-items:center;padding:14px;text-align:left;border-radius:0}
.rn{width:44px;height:44px;flex:none;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-family:var(--mono);font-weight:700;color:var(--red)}
.module.full .rn{background:var(--green-soft);color:var(--green)}
.mt{flex:1;min-width:0}
.mt h3{font-size:16px;font-weight:800;font-stretch:110%}
.mt p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.mbar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--red)}
.module.full .mbar i{background:var(--green)}
.mc{font-family:var(--mono);font-size:12px;color:var(--muted)}
.lesson{display:grid;grid-template-columns:32px 1fr;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-weight:900;color:#0E0F12}
.lesson.done .chk{background:var(--green);border-color:var(--green)}
.lt{font-weight:700}
.lt .id{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:6px}
.lesson.done .lt{color:var(--green)}
.ld{margin:2px 0 6px;font-size:13px;color:var(--muted)}
.lk{font-size:13px;background:var(--surface2);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.lk b{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin-right:6px}
.small{font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px}

.note{display:flex;flex-direction:column;gap:6px}
.note .nt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.note .nt b{font-weight:800}
.note .nd{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.note .nb{white-space:pre-wrap;font-size:14px;color:#d5d8df;overflow-wrap:anywhere}
.note .nb.clip{max-height:4.6em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)}
.empty{text-align:center;color:var(--muted);padding:28px 16px}

.term{display:flex;flex-direction:column;gap:4px}
.term b{font-size:16px;font-weight:800}
.term p{margin:0;font-size:14px;color:#d5d8df}
.term .src{font-family:var(--mono);font-size:11px;color:var(--muted)}
.term.locked b{color:var(--muted)} .term.locked p{color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}

.ranks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;opacity:.45}
.rk.on{opacity:1;border-color:var(--gold)}
.rk .e{font-size:24px} .rk .n{font-weight:800;font-size:13px} .rk .x{font-family:var(--mono);font-size:11px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.bd .e{font-size:28px;filter:grayscale(1);opacity:.35}
.bd.on{border-color:var(--gold);background:linear-gradient(180deg,var(--gold-soft),var(--surface))}
.bd.on .e{filter:none;opacity:1}
.bd .n{font-weight:800;font-size:13px}
.bd .d{font-size:11px;color:var(--muted);line-height:1.3}

.cal{overflow-x:auto}
.calgrid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;width:max-content}
.calgrid i{width:14px;height:14px;border-radius:3px;background:var(--surface2)}
.calgrid i.l1{background:#5a1c26}.calgrid i.l2{background:#a01f33}.calgrid i.l3{background:#ff4a60}
.calgrid i.t{outline:2px solid var(--gold);outline-offset:-1px}
.legend{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--muted);margin-top:8px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(14,15,18,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--muted);position:relative}
.tab .i{font-size:20px;line-height:1;filter:grayscale(1);opacity:.7}
.tab.on{color:var(--ink)} .tab.on .i{filter:none;opacity:1}
.tab.on::before{content:"";position:absolute;top:-6px;width:28px;height:3px;border-radius:2px;background:var(--red)}
.dot{position:absolute;top:2px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:8px;background:var(--blue);color:#fff;font-size:10px;font-family:var(--mono);display:grid;place-items:center;padding:0 4px}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:var(--surface);width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.sheet h3{font-size:18px;font-weight:900;text-transform:uppercase}
.sheet p{color:var(--muted);font-size:14px;margin:0}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.count.ok{color:var(--green)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:40;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.win{position:fixed;inset:0;display:grid;place-items:center;z-index:30;pointer-events:none}
.win div{background:var(--gold);color:#1a1300;font-weight:900;font-stretch:125%;text-transform:uppercase;font-size:26px;padding:18px 26px;border-radius:14px;text-align:center;animation:pop 1.8s ease forwards;box-shadow:0 20px 60px rgba(0,0,0,.5);max-width:calc(100% - 40px)}
.win small{display:block;font-size:14px;font-weight:600;font-stretch:100%;text-transform:none}
@keyframes pop{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.08);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.95)}}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:29}
@media (max-width:380px){.ranks,.badges{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.win div{animation:none}.toast{transition:none}}
</style>
</head>

const RANKS=[[0,"Početnik","🤍","#C9CDD6"],[800,"Amater","💛","#E8D23A"],[2000,"Takmičar","🧡","#F08A2B"],[3500,"Profi","❤️","#D7263D"],[5500,"Šampion","🏆","#E8B23A"],[7500,"Legenda","👑","#B98CFF"]];

try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)S=Object.assign(S,s)}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const day=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const fmt=d=>{const x=new Date(d);return x.getDate()+"."+(x.getMonth()+1)+"."};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function lesson(id){const [m,i]=id.split(".").map(Number);return {m,i,x:PLAN[m-1].l[i-1]}}
function roundDone(m){return PLAN[m-1].l.every((_,i)=>S.done[m+"."+(i+1)])}
function revCount(){let n=0;for(const k in S.rev)n+=(S.rev[k].ok||0);return n}
function xp(){let x=Object.keys(S.done).length*XP_L+revCount()*XP_REV;PLAN.forEach(m=>{if(roundDone(m.n))x+=XP_R});return x}
function rankOf(x){let r=0;RANKS.forEach((k,i)=>{if(x>=k[0])r=i});return r}
function activeDays(){return new Set(Object.values(S.done).map(v=>day(v.t)))}
function streak(){const days=activeDays();let d=new Date(),n=0;if(!days.has(day(d)))d.setDate(d.getDate()-1);while(days.has(day(d))){n++;d.setDate(d.getDate()-1)}return n}
function best(){const days=[...activeDays()].sort();let b=0,c=0,prev=null;days.forEach(s=>{const t=new Date(s+"T12:00");if(prev&&(t-prev)/864e5<1.5)c++;else c=1;b=Math.max(b,c);prev=t});return b}
function todayOk(){return activeDays().has(day(new Date()))}
function msgFor(id){const {x}=lesson(id);return `Claude Kamp, lekcija ${id}: ${x[0]}. Vodi me kroz lekciju i zadatak: ${x[2]}. Na kraju mi postavi 3 pitanja, pa napiši kratak rezime (pitanja, moji odgovori i šta sam naučio) da ga nalepim u belešku.`}
function dueReviews(){const now=new Date();return Object.keys(S.rev).filter(id=>S.done[id]&&S.rev[id].next&&new Date(S.rev[id].next)<=now).sort((a,b)=>new Date(S.rev[a].next)-new Date(S.rev[b].next))}
function unlockedTerms(){return TERMS.filter(t=>S.done[t[0]])}

  const X=xp(),r=rankOf(X),R=RANKS[r],N=RANKS[r+1],nDone=Object.keys(S.done).length,st=streak(),ok=todayOk();

function calHTML(){
  const weeks=15,today=new Date();today.setHours(12,0,0,0);
  const start=addDays(today,-((today.getDay()+6)%7)-7*(weeks-1));
  const c={};Object.values(S.done).forEach(v=>{const d=day(v.t);c[d]=(c[d]||0)+1});
  let cells="";for(let i=0;i<weeks*7;i++){const d=addDays(start,i);if(d>today){cells+=`<i style="visibility:hidden"></i>`;continue}const n=c[day(d)]||0;cells+=`<i class="${n>=3?"l3":n===2?"l2":n===1?"l1":""} ${day(d)===day(today)?"t":""}" title="${fmt(d)}: ${n} lekcija"></i>`}
  const daysActive=Object.keys(c).filter(d=>new Date(d+"T12:00")>=start).length;
  return `<section class="card"><div class="secthead" style="margin-bottom:10px"><h3>Kalendar treninga</h3><span class="eyebrow">${daysActive} dana učenja · 15 ned.</span></div><div class="cal"><div class="calgrid">${cells}</div></div><div class="legend">manje <i style="background:var(--surface2)"></i><i style="background:#5a1c26"></i><i style="background:#a01f33"></i><i style="background:#ff4a60"></i> više</div></section>`}

  const r=rankOf(xp()),days=S.lastBackup?Math.floor((Date.now()-new Date(S.lastBackup))/864e5):null;
  let h=`<h1 class="viewtitle">Profil</h1>`+fighterHTML()+calHTML();
  h+=`<div class="secthead"><h3>Bedževi</h3><span class="eyebrow">${S.badges.length}/${BADGES.length}</span></div><div class="badges">${BADGES.map(b=>`<div class="bd ${S.badges.includes(b[0])?"on":""}"><span class="e">${b[1]}</span><span class="n">${b[2]}</span><span class="d">${b[3]}</span></div>`).join("")}</div>`;
  h+=`<div class="secthead"><h3>Rangovi</h3><span class="eyebrow">${XP_L} XP lekcija · +${XP_R} runda · +${XP_REV} ponavljanje</span></div><div class="ranks">${RANKS.map((k,i)=>`<div class="rk ${i<=r?"on":""}"><div class="e">${k[2]}</div><div class="n">${k[1]}</div><div class="x">${k[0]} XP</div></div>`).join("")}</div>`;
  h+=`<section class="card" style="display:flex;flex-direction:column;gap:10px"><h3 style="font-size:16px;font-weight:900;text-transform:uppercase">Rezervna kopija</h3>
   <p class="muted" style="margin:0;font-size:14px">Napredak i beleške su samo na ovom telefonu. Sačuvaj kopiju da ih ne izgubiš ako promeniš telefon ili obrišeš Chrome.</p>
   <div class="${days===null||days>7?"today":"today ok"}">${days===null?"⚠️ Još nemaš nijednu kopiju.":days===0?"✅ Kopija napravljena danas.":`${days>7?"⚠️":"✅"} Poslednja kopija pre ${days} dana.`}</div>
   <div class="row"><button class="btn btn-r" id="bkSave">Sačuvaj fajl</button><button class="btn btn-g" id="bkCopy">Kopiraj kao tekst</button><button class="btn btn-g" id="bkLoad">Vrati iz fajla</button></div></section>`;
  h+=`<section class="card" style="display:flex;flex-direction:column;gap:10px"><h3 style="font-size:16px;font-weight:900;text-transform:uppercase">Podešavanja</h3>
   <p class="muted" style="margin:0;font-size:14px">Podsetnici stižu u 8h i 21h preko aplikacije ntfy. Ako si danas završio lekciju, večernji podsetnik postaje čestitka.</p>
   <div class="row"><button class="btn btn-g" id="btnSound">${S.sound?"🔊 Zvuk uključen":"🔇 Zvuk isključen"}</button><button class="btn btn-g" id="btnSummary">Kopiraj napredak za Claude</button></div></section>`;
  return h}

function render(){
  const v={trening:vTrening,plan:vPlan,sveska:vSveska,recnik:vRecnik,profil:vProfil}[VIEW]();
  $("#view").innerHTML=`<div style="display:flex;flex-direction:column;gap:16px">${v}</div>`;
  renderTabs();
  const qs=$("#qSveska");if(qs)qs.oninput=e=>{q.sveska=e.target.value;const p=e.target.selectionStart;render();const n=$("#qSveska");n.focus();n.setSelectionRange(p,p)};
  const qr=$("#qRecnik");if(qr)qr.oninput=e=>{q.recnik=e.target.value;const p=e.target.selectionStart;render();const n=$("#qRecnik");n.focus();n.setSelectionRange(p,p)};
}
function go(v){VIEW=v;render();scrollTo(0,0)}

/* ---------- sheet ---------- */
function openSheet(html){$("#sheetBody").innerHTML=html;$("#sheet").hidden=false}
function closeSheet(){$("#sheet").hidden=true;$("#sheetBody").innerHTML=""}
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet()});

function finishSheet(id){
  const {x}=lesson(id);
  openSheet(`<span class="eyebrow">Predaja · lekcija ${id}</span><h3>${esc(x[0])}</h3>
   <p>Nalepi rezime koji ti je Claude dao na kraju lekcije (3 pitanja i tvoji odgovori) ili svojim rečima napiši šta si naučio. Najmanje ${MIN_NOTE} znakova.</p>
   <textarea id="noteIn" placeholder="Šta sam naučio u ovoj lekciji…"></textarea><div class="count" id="noteCount">0/${MIN_NOTE}</div>
   <div class="row"><button class="btn btn-r" id="noteOk" disabled>Predaj i završi lekciju</button><button class="btn btn-g" id="noteCancel">Odustani</button></div>`);
  const t=$("#noteIn"),b=$("#noteOk"),c=$("#noteCount");
  t.oninput=()=>{const n=t.value.trim().length;c.textContent=n+"/"+MIN_NOTE;c.classList.toggle("ok",n>=MIN_NOTE);b.disabled=n<MIN_NOTE};
  b.onclick=()=>{const n=t.value.trim();if(n.length<MIN_NOTE)return;closeSheet();complete(id,n)};
  $("#noteCancel").onclick=closeSheet;
}
function viewSheet(id){
  const {x}=lesson(id),d=S.done[id];
  openSheet(`<span class="eyebrow">Beleška · lekcija ${id} · ${fmt(d.t)}</span><h3>${esc(x[0])}</h3>
   <textarea id="noteEdit">${esc(d.note||"")}</textarea>
   <div class="row"><button class="btn btn-r" id="noteSave">Sačuvaj izmene</button><button class="btn btn-g" id="noteClose">Zatvori</button></div>
   <div id="undoBox"><button class="small" id="undoAsk" style="color:var(--muted)">Vrati lekciju kao nezavršenu</button></div>`);
  $("#noteSave").onclick=()=>{const n=$("#noteEdit").value.trim();if(n.length<MIN_NOTE){toast("Beleška mora imati bar "+MIN_NOTE+" znakova.");return}S.done[id].note=n;save();closeSheet();render();toast("Beleška sačuvana.")};
  $("#noteClose").onclick=closeSheet;
  $("#undoAsk").onclick=()=>{$("#undoBox").innerHTML=`<p style="color:#ffb3bd">Sigurno? Gubiš XP i belešku za ovu lekciju.</p><div class="row" style="margin-top:8px"><button class="btn btn-r" id="undoYes">Da, vrati</button><button class="btn btn-g" id="undoNo">Ne</button></div>`;
    $("#undoYes").onclick=()=>{delete S.done[id];delete S.rev[id];newBadgesSilently();save();closeSheet();render();toast("Lekcija "+id+" vraćena.")};
    $("#undoNo").onclick=()=>viewSheet(id)};
}
function newBadgesSilently(){S.badges=BADGES.filter(b=>b[4]()).map(b=>b[0])}

/* ---------- akcije ---------- */
function complete(id,note){
  const m=+id.split(".")[0],r0=rankOf(xp()),wasRound=roundDone(m);
  S.done[id]={t:new Date().toISOString(),note};
  S.rev[id]={ok:0,next:addDays(new Date(),3).toISOString()};
  const fresh=newBadges();save();openM.add(m);
  const r1=rankOf(xp()),wins=[];
  if(r1>r0)wins.push(["Novi rang: "+RANKS[r1][1]+" "+RANKS[r1][2],"Svaka čast, Uroše!"]);
  if(roundDone(m)&&!wasRound)wins.push(["Runda "+m+" dobijena! 🥊","+"+XP_R+" XP bonus"]);
  fresh.forEach(b=>wins.push(["Bedž: "+b[2]+" "+b[1],b[3]]));
  try{navigator.vibrate&&navigator.vibrate(wins.length?[80,60,80,60,200]:60)}catch(e){}
  if(wins.length){bell(3);confetti(200);showWins(wins)}else{bell(1);confetti(50);toast("+"+XP_L+" XP · lekcija "+id+" gotova 💪")}
  ping();render();
}
function reviewOk(id){const r=S.rev[id];r.ok=(r.ok||0)+1;r.next=r.ok>=2?null:addDays(new Date(),7).toISOString();delete revShow[id];const fresh=newBadges();save();bell(1);
  if(fresh.length){confetti(120);showWins(fresh.map(b=>["Bedž: "+b[2]+" "+b[1],b[3]]))}else toast("+"+XP_REV+" XP · znanje je tu 🧠");render()}
function reviewNo(id){S.rev[id].next=addDays(new Date(),2).toISOString();delete revShow[id];save();toast("Važi, pitam te opet za 2 dana.");render()}

/* pametni podsetnik: javi serveru da je danas učio */
async function ping(){S.pendingPing=day(new Date());save();try{const r=await fetch("https://ntfy.sh/"+DONE_TOPIC,{method:"POST",body:S.pendingPing});if(r.ok){S.pendingPing=null;save()}}catch(e){}}
if(S.pendingPing&&S.pendingPing===day(new Date()))ping();

/* rezervna kopija */
function backupData(){return JSON.stringify({app:"claude-kamp",v:2,saved:new Date().toISOString(),S:{done:S.done,rev:S.rev,badges:S.badges}})}
function markBackup(){S.lastBackup=new Date().toISOString();newBadges();save();render()}
function restore(text){
  let d;try{d=JSON.parse(text)}catch(e){toast("Fajl nije ispravna kopija.");return}
  if(!d||d.app!=="claude-kamp"||!d.S||typeof d.S.done!=="object"){toast("Ovo nije kopija Claude Kampa.");return}
  const n=Object.keys(d.S.done).length;
  openSheet(`<h3>Vrati kopiju?</h3><p>Kopija od ${fmt(d.saved)} ima ${n} završenih lekcija. Trenutni napredak na ovom telefonu (${Object.keys(S.done).length} lekcija) biće zamenjen.</p><div class="row"><button class="btn btn-r" id="rsYes">Vrati kopiju</button><button class="btn btn-g" id="rsNo">Odustani</button></div>`);
  $("#rsYes").onclick=()=>{S.done=d.S.done;S.rev=d.S.rev||{};S.badges=d.S.badges||[];newBadgesSilently();save();closeSheet();render();toast("Napredak vraćen: "+n+" lekcija.")};
  $("#rsNo").onclick=closeSheet;
}
$("#fileIn").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restore(r.result);r.readAsText(f);e.target.value=""};

/* zvuk, konfete, poruke */
let AC=null;
function bell(times){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();for(let k=0;k<times;k++){const t=AC.currentTime+k*.28;[880,1320,1760].forEach((f,j)=>{const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25/(j+1),t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+1.2);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+1.3)})}}catch(e){}}
function confetti(n){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const c=$("#fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=["#D7263D","#E8B23A","#FFFFFF","#3DBE7E"];const P=Array.from({length:n},()=>({x:c.width/2,y:c.height*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+3,c:cols[Math.random()*4|0],a:Math.random()*6}));let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore()});if(++f<110)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})()}
function showWins(list){const w=$("#win");let i=0;(function next(){if(i>=list.length){w.hidden=true;return}const [a,b]=list[i++];w.hidden=true;void w.offsetWidth;w.innerHTML=`<div>${esc(a)}<small>${esc(b)}</small></div>`;w.hidden=false;clearTimeout(w._t);w._t=setTimeout(next,1900)})()}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2200)}
async function copy(t,msg){try{await navigator.clipboard.writeText(t);toast(msg||"Kopirano. Nalepi u chat sa Claude-om.");return true}catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}ta.remove();toast(ok?(msg||"Kopirano."):"Označi tekst i kopiraj ručno.");return ok}}

document.addEventListener("click",e=>{
  const g=k=>e.target.closest("[data-"+k+"]");let el;
  if(el=g("tab"))return go(el.dataset.tab);
  if(el=g("copy"))return copy(msgFor(el.dataset.copy));
  if(el=g("finish"))return finishSheet(el.dataset.finish);
  if(el=g("view"))return viewSheet(el.dataset.view);
  if(el=g("revshow")){revShow[el.dataset.revshow]=1;return render()}
  if(el=g("revok"))return reviewOk(el.dataset.revok);
  if(el=g("revno"))return reviewNo(el.dataset.revno);
  if(el=g("m")){const n=+el.dataset.m;openM.has(n)?openM.delete(n):openM.add(n);return render()}
  const id=e.target.closest("button")?.id;
  if(id==="btnSound"){S.sound=!S.sound;save();render()}
  else if(id==="btnSummary"){const ids=ALL.filter(i=>S.done[i]);copy(`Claude Kamp napredak: ${ids.length}/${ALL.length} lekcija, ${xp()} XP, rang ${RANKS[rankOf(xp())][1]}, niz ${streak()} dana, bedževi ${S.badges.length}/${BADGES.length}. Završene: ${ids.join(", ")||"nijedna"}.`)}
  else if(id==="bkSave"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([backupData()],{type:"application/json"}));a.download="claude-kamp-kopija-"+day(new Date())+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);markBackup();toast("Kopija sačuvana u Preuzimanja (Downloads).")}
  else if(id==="bkCopy"){copy(backupData(),"Kopija kopirana. Pošalji je sebi ili Claude-u.").then(ok=>{if(ok)markBackup()})}
  else if(id==="bkLoad"){$("#fileIn").click()}
});

const first=ALL.find(id=>!S.done[id]);openM.add(first?+first.split(".")[0]:1);
newBadgesSilently();save();render();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
document.addEventListener("visibilitychange",()=>{if(!document.hidden){if(S.pendingPing===day(new Date()))ping();render()}});
</script>
</body>
</html>
